{% extends "base.html" %}
{% block title %}Новая заявка{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
  <h2>Новая заявка</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Отправить</button>
    <a class="btn btn-link" href="{% url 'ticket_list' %}">Отмена</a>
  </form>
</div>
{% endblock %}
