{% extends "base.html" %}
{% block title %}Новая заявка{% endblock %}
{% block content %}
<div class="medium panel">
  <h1>Новая заявка</h1>
  <p class="muted">Напишите, что сломалось и где, чтобы специалист пришёл сразу по адресу.</p>
  <form method="post">
    {% csrf_token %}
    {% include "form_fields.html" %}
    <div class="form-actions">
      <button class="btn">Создать заявку</button>
      <a href="{% url 'ticket_list' %}">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
